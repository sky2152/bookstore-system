server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/book_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.book.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 统一 JSON 里的时间格式与时区：数据库存的是东八区本地时间，
# 默认 Jackson 会按 UTC 序列化，页面上会比实际时间早 8 小时
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# spring.sql.init.mode=never  # 注释掉，让Spring Boot自动执行schema.sql
