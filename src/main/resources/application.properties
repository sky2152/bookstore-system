server.port=8080

# 数据库账号密码不进仓库。
#   方式一（推荐）：本地新建 application-local.properties（已被 .gitignore 忽略），
#                  内容参考 application-local.properties.example，并用 local profile 启动
#   方式二：设置环境变量 DB_USERNAME / DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/book_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.book.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 统一 JSON 里的时间格式与时区：数据库存的是东八区本地时间，
# 默认 Jackson 会按 UTC 序列化，页面上会比实际时间早 8 小时
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Spring Boot 默认只对内嵌数据库执行 schema.sql，MySQL 需手动执行建表脚本
# spring.sql.init.mode=never
