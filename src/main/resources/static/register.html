<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>用户注册</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.register-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
}
.logo {
    text-align: center;
    font-size: 48px;
    margin-bottom: 10px;
}
.register-card h2 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
    font-size: 24px;
    font-weight: 600;
}
.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 25px;
    font-size: 14px;
}
.form-group {
    margin-bottom: 18px;
    position: relative;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    color: #666;
    font-weight: 500;
}
.form-group input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e5e5e5;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    box-sizing: border-box;
}
.form-group input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.form-group input.error {
    border-color: #e74c3c;
}
.form-group input.success {
    border-color: #27ae60;
}
.form-hint {
    font-size: 12px;
    margin-top: 6px;
    min-height: 18px;
}
.form-hint.error {
    color: #e74c3c;
}
.form-hint.success {
    color: #27ae60;
}
.btn-register {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
}
.btn-register:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102,126,234,0.4);
}
.btn-register:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.tip {
    text-align: center;
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #f0f0f0;
}
.tip a {
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}
.tip a:hover {
    color: #764ba2;
}
.hint {
    text-align: center;
    margin-top: 12px;
    color: #aaa;
    font-size: 12px;
}
.msg-box {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show {
    display: block;
    animation: fadeIn 0.3s;
}
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="register-card">
    <div class="logo">📝</div>
    <h2>用户注册</h2>
    <p class="subtitle">欢迎加入图书商城</p>
    <div id="msgBox" class="msg-box"></div>
    <form id="registerForm" action="/register" method="post">
        <div class="form-group">
            <label>账号（用户名）</label>
            <input type="text" id="usernameInput" name="username" placeholder="请输入账号（不能为 admin）" required>
            <div id="usernameHint" class="form-hint"></div>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="passwordInput" name="password" placeholder="请输入密码" required minlength="6">
            <div id="passwordHint" class="form-hint"></div>
        </div>
        <button type="submit" id="registerBtn" class="btn-register" disabled>注册账号</button>
    </form>
    <div class="tip">
        <a href="/login.html">已有账号？返回登录 →</a>
    </div>
    <div class="hint">管理员账号需使用 admin 登录</div>
</div>

<script>
let usernameValid = false;
let passwordValid = false;
let checkTimeout = null;

const usernameInput = document.getElementById('usernameInput');
const passwordInput = document.getElementById('passwordInput');
const usernameHint = document.getElementById('usernameHint');
const passwordHint = document.getElementById('passwordHint');
const registerBtn = document.getElementById('registerBtn');
const msgBox = document.getElementById('msgBox');

// 检查用户名
function checkUsername() {
    const username = usernameInput.value.trim();
    
    if(!username) {
        usernameHint.textContent = '';
        usernameInput.className = '';
        usernameValid = false;
        updateButton();
        return;
    }
    
    if(username === 'admin') {
        usernameHint.textContent = '该用户名不可使用';
        usernameHint.className = 'form-hint error';
        usernameInput.className = 'error';
        usernameValid = false;
        updateButton();
        return;
    }
    
    // 防抖检查
    clearTimeout(checkTimeout);
    checkTimeout = setTimeout(() => {
        fetch(`/api/user/check-username?username=${encodeURIComponent(username)}`)
            .then(res => res.json())
            .then(data => {
                if(data.exists) {
                    usernameHint.textContent = data.message;
                    usernameHint.className = 'form-hint error';
                    usernameInput.className = 'error';
                    usernameValid = false;
                } else {
                    usernameHint.textContent = data.message;
                    usernameHint.className = 'form-hint success';
                    usernameInput.className = 'success';
                    usernameValid = true;
                }
                updateButton();
            })
            .catch(err => {
                usernameHint.textContent = '';
                usernameInput.className = '';
                usernameValid = false;
                updateButton();
            });
    }, 500);
}

// 检查密码
function checkPassword() {
    const password = passwordInput.value;
    
    if(!password) {
        passwordHint.textContent = '';
        passwordInput.className = '';
        passwordValid = false;
        updateButton();
        return;
    }
    
    if(password.length < 6) {
        passwordHint.textContent = '密码长度至少6位';
        passwordHint.className = 'form-hint error';
        passwordInput.className = 'error';
        passwordValid = false;
    } else {
        passwordHint.textContent = '密码格式正确';
        passwordHint.className = 'form-hint success';
        passwordInput.className = 'success';
        passwordValid = true;
    }
    updateButton();
}

// 更新按钮状态
function updateButton() {
    registerBtn.disabled = !(usernameValid && passwordValid);
}

// 绑定事件
usernameInput.addEventListener('input', checkUsername);
passwordInput.addEventListener('input', checkPassword);

// 读取URL参数显示提示
(function(){
    let params = new URLSearchParams(window.location.search);
    let error = params.get('error');
    
    if(error){
        let errorMsg = '';
        switch(error){
            case 'admin': errorMsg = '该用户名不可使用'; break;
            case 'duplicate': errorMsg = '用户名已被使用'; break;
            case 'fail': errorMsg = '注册失败，请重试'; break;
        }
        if(errorMsg){
            msgBox.textContent = errorMsg;
            msgBox.className = 'msg-box show error';
        }
    }
})();
</script>
</body>
</html>
