<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>分类管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    font-size: 22px;
    font-weight: 600;
}
.header .nav-links a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    margin-left: 10px;
    transition: all 0.3s;
    font-size: 14px;
}
.header .nav-links a:hover {
    background: rgba(255,255,255,0.35);
}
.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
.form-row {
    display: flex;
    gap: 12px;
    align-items: center;
}
.form-row input {
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    flex: 1;
}
.form-row input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.btn-primary {
    padding: 12px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
th {
    background: #f8f9fa;
    padding: 16px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    color: #555;
    border-bottom: 2px solid #e5e7eb;
}
td {
    padding: 16px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}
tr:hover {
    background: #fafbfc;
}
.category-tag {
    display: inline-block;
    padding: 4px 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.btn-delete {
    color: #e74c3c;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
}
.btn-delete:hover { color: #c0392b; }
.empty-row td {
    text-align: center;
    padding: 60px 12px;
    color: #999;
}
.msg-box {
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show { display: block; animation: fadeIn 0.3s; }
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
.msg-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="header">
    <h1>📚 书店管理系统</h1>
    <div class="nav-links">
        <a href="bookList.html">图书管理</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div id="msgBox" class="msg-box"></div>

    <div class="card">
        <h2>新增分类</h2>
        <form id="addForm" class="form-row" onsubmit="addCategory(event)">
            <input name="categoryName" id="categoryNameInput" placeholder="分类名称，如：计算机、文学小说" required>
            <button type="submit" class="btn-primary">+ 新增</button>
        </form>
    </div>

    <div class="card">
        <h2>分类列表</h2>
        <table>
            <tr><th>ID</th><th>分类名称</th><th>操作</th></tr>
            <tr class="empty-row"><td colspan="3">加载中...</td></tr>
        </table>
    </div>
</div>

<script>
function showMsg(text, type){
    let box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box show ' + type;
    setTimeout(() => { box.className = 'msg-box'; }, 4000);
}

// 读取URL参数显示提示
(function(){
    let params = new URLSearchParams(window.location.search);
    let error = params.get('error');
    let msg = params.get('msg');
    if(error) showMsg(decodeURIComponent(error), 'error');
    if(msg) showMsg(decodeURIComponent(msg), 'success');
    if(history.replaceState){
        history.replaceState(null, '', '/categoryList.html');
    }
})();

// 新增分类（AJAX）
function addCategory(e){
    e.preventDefault();
    let name = document.getElementById('categoryNameInput').value.trim();
    if(!name){
        showMsg('请输入分类名称', 'error');
        return;
    }
    fetch('/category/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'categoryName=' + encodeURIComponent(name)
    })
    .then(r => r.json())
    .then(data => {
        if(data.success){
            showMsg(data.message, 'success');
            document.getElementById('categoryNameInput').value = '';
            loadCategories();
        } else {
            showMsg(data.message || '新增失败', 'error');
        }
    })
    .catch(err => {
        showMsg('请求失败，请重试', 'error');
    });
}

// 删除分类（AJAX）
function deleteCategory(id, name){
    if(!confirm('确认删除分类「' + name + '」?')) return;
    fetch('/category/del?id=' + id)
        .then(r => r.json())
        .then(data => {
            if(data.success){
                showMsg(data.message, 'success');
                loadCategories();
            } else {
                showMsg(data.message, 'error');
            }
        })
        .catch(err => {
            showMsg('删除请求失败，请重试', 'error');
        });
}

// 加载分类列表
function loadCategories(){
    fetch('/api/category/list')
        .then(r => r.json())
        .then(data => {
            let html = '<tr><th>ID</th><th>分类名称</th><th>操作</th></tr>';
            if(data.length === 0) {
                html += '<tr class="empty-row"><td colspan="3">暂无分类，请先添加</td></tr>';
            } else {
                data.forEach(c => {
                    html += '<tr>' +
                        '<td>' + c.id + '</td>' +
                        '<td><span class="category-tag">' + c.categoryName + '</span></td>' +
                        '<td><a href="javascript:void(0)" class="btn-delete" onclick="deleteCategory(' + c.id + ',\'' + c.categoryName.replace(/'/g,"\\'") + '\')">删除</a></td>' +
                        '</tr>';
                });
            }
            document.querySelector('table').innerHTML = html;
        })
        .catch(err => {
            document.querySelector('table').innerHTML =
                '<tr class="empty-row"><td colspan="3" style="color:#e74c3c;">加载失败</td></tr>';
        });
}

// 初始加载
loadCategories();
</script>
</body>
</html>
