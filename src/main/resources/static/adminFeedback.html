<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>缺货反馈管理 - 图书商城后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    font-size: 22px;
    font-weight: 600;
}
.nav-right {
    display: flex;
    gap: 10px;
    align-items: center;
}
.nav-right a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    transition: all 0.3s;
    font-size: 14px;
}
.nav-right a:hover {
    background: rgba(255,255,255,0.25);
}
.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 2px;
    margin-right: 12px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
th {
    background: #f8f9fa;
    padding: 16px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    color: #555;
    border-bottom: 2px solid #e5e7eb;
}
td {
    padding: 16px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}
tr:hover {
    background: #fafbfc;
}
.status-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.status-tag.pending {
    background: #fff3cd;
    color: #856404;
}
.status-tag.processing {
    background: #cce5ff;
    color: #004085;
}
.status-tag.done {
    background: #d4edda;
    color: #155724;
}
.btn-small {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-right: 5px;
}
.btn-process {
    background: #3498db;
    color: white;
}
.btn-process:hover {
    background: #2980b9;
}
.btn-done {
    background: #27ae60;
    color: white;
}
.btn-done:hover {
    background: #219a52;
}
.empty-row td {
    text-align: center;
    padding: 60px 12px;
    color: #999;
}
.msg-box {
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show { display: block; animation: fadeIn 0.3s; }
.msg-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="header">
    <h1>📊 缺货反馈管理</h1>
    <div class="nav-right">
        <a href="/admin/index">返回后台首页</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div id="msgBox" class="msg-box"></div>

    <div class="card">
        <h2>全部反馈记录</h2>
        <table id="feedbackTable">
            <tr>
                <th>ID</th><th>用户</th><th>图书名称</th><th>说明</th><th>提交时间</th><th>状态</th><th>操作</th>
            </tr>
            <tr class="empty-row"><td colspan="7">加载中...</td></tr>
        </table>
    </div>
</div>

<script>
function showMsg(text, type) {
    let box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box show ' + type;
    setTimeout(() => { box.className = 'msg-box'; }, 3000);
}

function loadFeedbacks() {
    fetch('/feedback/admin/list')
        .then(r => r.json())
        .then(data => {
            let html = '<tr><th>ID</th><th>用户</th><th>图书名称</th><th>说明</th><th>提交时间</th><th>状态</th><th>操作</th></tr>';
            if(!data.success || !data.data || data.data.length === 0) {
                html += '<tr class="empty-row"><td colspan="7">暂无反馈记录</td></tr>';
            } else {
                data.data.forEach(f => {
                    let statusText = '待处理';
                    let statusClass = 'pending';
                    if(f.status === 1) { statusText = '处理中'; statusClass = 'processing'; }
                    if(f.status === 2) { statusText = '已处理'; statusClass = 'done'; }
                    let actions = '';
                    if(f.status === 0) {
                        actions += '<button class="btn-small btn-process" onclick="updateStatus(' + f.id + ',1)">标记处理中</button>';
                        actions += '<button class="btn-small btn-done" onclick="updateStatus(' + f.id + ',2)">标记已处理</button>';
                    } else if(f.status === 1) {
                        actions += '<button class="btn-small btn-done" onclick="updateStatus(' + f.id + ',2)">标记已处理</button>';
                    }
                    html += '<tr>' +
                        '<td>' + f.id + '</td>' +
                        '<td>' + (f.username || '-') + '</td>' +
                        '<td>' + f.bookName + '</td>' +
                        '<td>' + (f.message || '-') + '</td>' +
                        '<td>' + (f.createTime || '') + '</td>' +
                        '<td><span class="status-tag ' + statusClass + '">' + statusText + '</span></td>' +
                        '<td>' + actions + '</td>' +
                        '</tr>';
                });
            }
            document.getElementById('feedbackTable').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('feedbackTable').innerHTML =
                '<tr class="empty-row"><td colspan="7" style="color:#e74c3c;">加载失败</td></tr>';
        });
}

function updateStatus(id, status) {
    let formData = new FormData();
    formData.append('id', id);
    formData.append('status', status);
    fetch('/feedback/admin/updateStatus', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if(data.success) {
                showMsg(data.message, 'success');
                loadFeedbacks();
            } else {
                showMsg(data.message, 'error');
            }
        })
        .catch(err => { showMsg('操作失败', 'error'); });
}

loadFeedbacks();
</script>
</body>
</html>
