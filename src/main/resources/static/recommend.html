<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>智能推荐 - 图书商城</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    font-size: 22px;
    font-weight: 600;
}
.nav-right {
    display: flex;
    gap: 10px;
    align-items: center;
}
.nav-right a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    transition: all 0.3s;
    font-size: 14px;
}
.nav-right a:hover {
    background: rgba(255,255,255,0.35);
}
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
.card h2 .subtitle {
    font-size: 14px;
    color: #999;
    font-weight: 400;
    margin-left: auto;
}
.book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
    margin-top: 10px;
}
.book-card {
    background: linear-gradient(135deg, #fff 0%, #faf8ff 100%);
    border: 2px solid #f0ecff;
    border-radius: 14px;
    padding: 20px;
    transition: all 0.3s;
    position: relative;
}
.book-card:hover {
    border-color: #667eea;
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(102,126,234,0.15);
}
.book-card .book-title {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
    line-height: 1.4;
}
.book-card .book-author {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
}
.book-card .book-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.book-card .book-price {
    color: #e67e22;
    font-weight: 700;
    font-size: 18px;
}
.book-card .book-category {
    display: inline-block;
    padding: 4px 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 500;
}
.book-card .book-stock {
    font-size: 12px;
    color: #999;
}
.book-card .book-actions {
    display: flex;
    gap: 10px;
}
.book-card .btn-buy {
    flex: 1;
    padding: 10px;
    background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.book-card .btn-buy:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(46,204,113,0.4);
}
.book-card .buy-input {
    width: 70px;
    padding: 10px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    text-align: center;
    background: #f8f9fa;
}
.book-card .buy-input:focus {
    border-color: #667eea;
    background: white;
}
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
}
.empty-state .icon {
    font-size: 64px;
    margin-bottom: 16px;
}
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.tab-btn {
    padding: 10px 24px;
    background: #f0f0f0;
    color: #666;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
}
.tab-btn:hover {
    background: #e0e0e0;
}
.tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}
.recommend-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    padding: 6px 12px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(245,87,108,0.3);
}
.loading {
    text-align: center;
    padding: 40px;
    color: #999;
}
/* 弹窗样式 */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}
.modal.active { display: flex; }
.modal-content {
    background: white;
    border-radius: 16px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.modal-content h3 {
    margin-bottom: 15px;
    font-size: 18px;
    color: #333;
}
.modal-content p {
    margin-bottom: 10px;
    color: #666;
    font-size: 14px;
}
.modal-content p strong {
    color: #333;
    font-size: 16px;
}
.btn-confirm {
    padding: 12px 28px;
    background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    margin-right: 10px;
    transition: all 0.3s;
}
.btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(46,204,113,0.4);
}
.btn-cancel {
    padding: 12px 28px;
    background: #95a5a6;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    transition: all 0.3s;
}
.btn-cancel:hover { background: #7f8c8d; }
/* 消息提示 */
.msg-box {
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show { display: block; animation: fadeIn 0.3s; }
.msg-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="header">
    <h1>🎯 智能推荐</h1>
    <div class="nav-right">
        <a href="/user/index">返回商城</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div id="msgBox" class="msg-box"></div>

    <div class="card">
        <h2>推荐算法 <span class="subtitle">选择推荐方式查看不同结果</span></h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('hybrid')">混合推荐</button>
            <button class="tab-btn" onclick="switchTab('history')">基于历史</button>
            <button class="tab-btn" onclick="switchTab('collaborative')">协同过滤</button>
            <button class="tab-btn" onclick="switchTab('hot')">热门推荐</button>
        </div>
        <div id="bookGrid" class="book-grid">
            <div class="loading">加载中...</div>
        </div>
    </div>
</div>

<!-- 购买确认弹窗 -->
<div class="modal" id="buyModal">
    <div class="modal-content">
        <h3>确认购买</h3>
        <p>图书: <strong id="confirmBookName"></strong></p>
        <p>购买数量: <strong id="confirmNum"></strong> 本</p>
        <p>总金额: <strong id="confirmTotal" style="color:#e67e22;font-size:18px;">¥0</strong></p>
        <button class="btn-confirm" onclick="doBuy()">确认购买</button>
        <button class="btn-cancel" onclick="closeBuy()">取消</button>
    </div>
</div>

<script>
let currentTab = 'hybrid';
let currentBook = null;
let currentNum = 0;

// 切换标签
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    loadRecommendations();
}

// 加载推荐
function loadRecommendations() {
    let url = '';
    switch(currentTab) {
        case 'hot':
            url = '/recommend/hot';
            break;
        case 'history':
            url = '/recommend/history';
            break;
        case 'collaborative':
            url = '/recommend/collaborative';
            break;
        case 'hybrid':
        default:
            url = '/recommend/hybrid';
            break;
    }

    document.getElementById('bookGrid').innerHTML = '<div class="loading">加载中...</div>';

    fetch(url)
        .then(r => r.json())
        .then(data => {
            if(!data.success) {
                if(data.message) {
                    showMsg(data.message, 'error');
                }
                document.getElementById('bookGrid').innerHTML =
                    '<div class="empty-state"><div class="icon">😕</div><div>暂无推荐数据</div></div>';
                return;
            }
            renderBooks(data.data);
        })
        .catch(err => {
            document.getElementById('bookGrid').innerHTML =
                '<div class="empty-state"><div class="icon">❌</div><div>加载失败</div></div>';
        });
}

// 渲染图书列表
function renderBooks(books) {
    if(!books || books.length === 0) {
        document.getElementById('bookGrid').innerHTML =
            '<div class="empty-state"><div class="icon">📚</div><div>暂无推荐图书</div></div>';
        return;
    }

    let html = '';
    books.forEach((book, i) => {
        html += '<div class="book-card">' +
            (i < 3 ? '<div class="recommend-badge">推荐</div>' : '') +
            '<div class="book-title">' + book.bookName + '</div>' +
            '<div class="book-author">' + book.author + '</div>' +
            '<div class="book-meta">' +
                '<span class="book-category">' + (book.categoryName || '未分类') + '</span>' +
            '</div>' +
            '<div class="book-meta">' +
                '<span class="book-price">¥' + book.price + '</span>' +
                '<span class="book-stock">库存: ' + book.stock + '</span>' +
            '</div>' +
            '<div class="book-actions">' +
                '<input type="number" id="num_' + book.id + '" value="1" min="1" max="' + book.stock + '" class="buy-input">' +
                '<button class="btn-buy" onclick=\'confirmBuy(' + JSON.stringify(book).replace(/'/g, "&apos;") + ')\'>购买</button>' +
            '</div>' +
        '</div>';
    });
    document.getElementById('bookGrid').innerHTML = html;
}

// 确认购买
function confirmBuy(book) {
    let numInput = document.getElementById('num_' + book.id);
    let num = parseInt(numInput.value);
    if(!num || num <= 0) {
        showMsg('请输入正确的购买数量', 'error');
        return;
    }
    if(num > book.stock) {
        showMsg('库存不足，最多可购买 ' + book.stock + ' 本', 'error');
        return;
    }

    let total = (parseFloat(book.price) * num).toFixed(2);

    currentBook = book;
    currentNum = num;
    document.getElementById('confirmBookName').textContent = book.bookName;
    document.getElementById('confirmNum').textContent = num;
    document.getElementById('confirmTotal').textContent = '¥' + total;
    document.getElementById('buyModal').classList.add('active');
}

// 执行购买
function doBuy() {
    if(!currentBook) return;

    let form = document.createElement('form');
    form.method = 'POST';
    form.action = '/buy';
    form.innerHTML =
        '<input name="bookId" value="' + currentBook.id + '">' +
        '<input name="num" value="' + currentNum + '">';
    document.body.appendChild(form);
    form.submit();
}

function closeBuy() {
    document.getElementById('buyModal').classList.remove('active');
}

function showMsg(text, type) {
    let box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box show ' + type;
    setTimeout(() => { box.className = 'msg-box'; }, 3000);
}

// 初始化
loadRecommendations();

// 读取URL参数显示提示
(function(){
    let params = new URLSearchParams(window.location.search);
    let error = params.get('error');
    let msg = params.get('msg');
    if(error) showMsg(decodeURIComponent(error), 'error');
    if(msg) showMsg(decodeURIComponent(msg), 'success');
})();
</script>
</body>
</html>
