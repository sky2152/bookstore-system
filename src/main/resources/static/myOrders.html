<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>我的订单</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 { font-size: 22px; font-weight: 600; }
.nav-right { display: flex; gap: 10px; align-items: center; }
.balance-box {
    background: rgba(255,255,255,0.2);
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 14px;
}
.balance-box strong { font-size: 18px; font-weight: 700; }
.nav-right a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    transition: all 0.3s;
    font-size: 14px;
}
.nav-right a:hover { background: rgba(255,255,255,0.35); }
.container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th {
    background: #f8f9fa;
    padding: 16px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    color: #555;
    border-bottom: 2px solid #e5e7eb;
}
td {
    padding: 16px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}
tr:hover { background: #fafbfc; }
.price { color: #e67e22; font-weight: 700; }
.book-title { font-weight: 600; color: #333; }
.order-time { color: #999; font-size: 13px; }
.status-tag {
    display: inline-block;
    padding: 4px 12px;
    background: #d4edda;
    color: #155724;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.empty-row td { text-align: center; padding: 60px 12px; color: #999; }
.stat-row {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}
.stat-box {
    flex: 1;
    background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
}
.stat-box .stat-label { font-size: 13px; color: #888; margin-bottom: 6px; }
.stat-box .stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
</style>
</head>
<body>
<div class="header">
    <h1>📋 我的订单</h1>
    <div class="nav-right">
        <a href="/user/index">← 返回商城</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>消费统计</h2>
        <div class="stat-row">
            <div class="stat-box">
                <div class="stat-label">订单总数</div>
                <div class="stat-value" id="totalOrders">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">购书总数</div>
                <div class="stat-value" id="totalBooks">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">累计消费</div>
                <div class="stat-value" id="totalMoney">¥0</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>订单记录</h2>
        <table>
            <tr>
                <th>订单号</th><th>图书名称</th><th>数量</th><th>金额</th><th>下单时间</th><th>状态</th>
            </tr>
            <tr class="empty-row"><td colspan="6">加载中...</td></tr>
        </table>
    </div>
</div>

<script>
fetch('/api/user/orders')
    .then(r => r.json())
    .then(data => {
        if(data && data.error){
            document.querySelector('table').innerHTML =
                '<tr class="empty-row"><td colspan="6" style="color:#e74c3c;">' + data.error + '，请先登录</td></tr>';
            return;
        }
        if(!data || data.length === 0){
            document.querySelector('table').innerHTML =
                '<tr><th>订单号</th><th>图书名称</th><th>数量</th><th>金额</th><th>下单时间</th><th>状态</th></tr>' +
                '<tr class="empty-row"><td colspan="6">暂无订单记录</td></tr>';
            return;
        }

        let totalBooks = 0;
        let totalMoney = 0;
        let html = '<tr><th>订单号</th><th>图书名称</th><th>数量</th><th>金额</th><th>下单时间</th><th>状态</th></tr>';

        data.forEach(order => {
            totalBooks += order.buyNum;
            totalMoney += parseFloat(order.totalMoney);
            let time = order.createTime ? order.createTime.replace('T', ' ').substring(0, 19) : '';
            html += '<tr>' +
                '<td>#' + order.id + '</td>' +
                '<td><span class="book-title">' + (order.bookName || '未知图书') + '</span></td>' +
                '<td>' + order.buyNum + ' 本</td>' +
                '<td class="price">¥' + order.totalMoney + '</td>' +
                '<td class="order-time">' + time + '</td>' +
                '<td><span class="status-tag">已完成</span></td>' +
                '</tr>';
        });
        document.querySelector('table').innerHTML = html;

        document.getElementById('totalOrders').textContent = data.length;
        document.getElementById('totalBooks').textContent = totalBooks;
        document.getElementById('totalMoney').textContent = '¥' + totalMoney.toFixed(2);
    })
    .catch(err => {
        document.querySelector('table').innerHTML =
            '<tr class="empty-row"><td colspan="6" style="color:#e74c3c;">加载失败</td></tr>';
    });
</script>
</body>
</html>
