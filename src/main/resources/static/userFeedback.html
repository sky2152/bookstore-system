<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>缺货反馈 - 图书商城</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    font-size: 22px;
    font-weight: 600;
}
.nav-right {
    display: flex;
    gap: 10px;
    align-items: center;
}
.nav-right a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    transition: all 0.3s;
    font-size: 14px;
}
.nav-right a:hover {
    background: rgba(255,255,255,0.35);
}
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
}
.form-group select, .form-group textarea, .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
}
.form-group select:focus, .form-group textarea:focus, .form-group input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.form-group textarea {
    resize: vertical;
    min-height: 100px;
}
.btn-primary {
    padding: 12px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
th {
    background: #f8f9fa;
    padding: 16px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    color: #555;
    border-bottom: 2px solid #e5e7eb;
}
td {
    padding: 16px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}
tr:hover {
    background: #fafbfc;
}
.status-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.status-tag.pending {
    background: #fff3cd;
    color: #856404;
}
.status-tag.processing {
    background: #cce5ff;
    color: #004085;
}
.status-tag.done {
    background: #d4edda;
    color: #155724;
}
.empty-row td {
    text-align: center;
    padding: 60px 12px;
    color: #999;
}
.msg-box {
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show { display: block; animation: fadeIn 0.3s; }
.msg-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="header">
    <h1>📚 缺货反馈</h1>
    <div class="nav-right">
        <a href="/user/index">返回首页</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div id="msgBox" class="msg-box"></div>

    <div class="card">
        <h2>提交缺货反馈</h2>
        <div class="form-group">
            <label>选择图书</label>
            <select id="bookSelect">
                <option value="">请选择图书</option>
            </select>
        </div>
        <div class="form-group">
            <label>补充说明（可选）</label>
            <textarea id="messageInput" placeholder="请描述您的需求..."></textarea>
        </div>
        <button class="btn-primary" onclick="submitFeedback()">提交反馈</button>
    </div>

    <div class="card">
        <h2>我的反馈记录</h2>
        <table id="feedbackTable">
            <tr>
                <th>图书名称</th><th>提交时间</th><th>状态</th><th>说明</th>
            </tr>
            <tr class="empty-row"><td colspan="4">加载中...</td></tr>
        </table>
    </div>
</div>

<script>
function showMsg(text, type) {
    let box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box show ' + type;
    setTimeout(() => { box.className = 'msg-box'; }, 3000);
}

function loadBooks() {
    fetch('/api/book/list')
        .then(r => r.json())
        .then(data => {
            let sel = document.getElementById('bookSelect');
            sel.innerHTML = '<option value="">请选择图书</option>';
            data.forEach(book => {
                let opt = document.createElement('option');
                opt.value = book.id;
                opt.textContent = book.bookName + ' - ' + book.author + ' (库存:' + book.stock + ')';
                sel.appendChild(opt);
            });
        });
}

function submitFeedback() {
    let bookId = document.getElementById('bookSelect').value;
    let message = document.getElementById('messageInput').value.trim();
    if(!bookId) {
        showMsg('请选择图书', 'error');
        return;
    }
    let formData = new FormData();
    formData.append('bookId', bookId);
    formData.append('message', message);
    fetch('/feedback/create', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if(data.success) {
                showMsg(data.message, 'success');
                document.getElementById('messageInput').value = '';
                document.getElementById('bookSelect').value = '';
                loadFeedbacks();
            } else {
                showMsg(data.message, 'error');
            }
        })
        .catch(err => { showMsg('提交失败', 'error'); });
}

function loadFeedbacks() {
    fetch('/feedback/user/list')
        .then(r => r.json())
        .then(data => {
            let html = '<tr><th>图书名称</th><th>提交时间</th><th>状态</th><th>说明</th></tr>';
            if(!data.success || !data.data || data.data.length === 0) {
                html += '<tr class="empty-row"><td colspan="4">暂无反馈记录</td></tr>';
            } else {
                data.data.forEach(f => {
                    let statusText = '待处理';
                    let statusClass = 'pending';
                    if(f.status === 1) { statusText = '处理中'; statusClass = 'processing'; }
                    if(f.status === 2) { statusText = '已处理'; statusClass = 'done'; }
                    html += '<tr>' +
                        '<td>' + f.bookName + '</td>' +
                        '<td>' + (f.createTime || '') + '</td>' +
                        '<td><span class="status-tag ' + statusClass + '">' + statusText + '</span></td>' +
                        '<td>' + (f.message || '-') + '</td>' +
                        '</tr>';
                });
            }
            document.getElementById('feedbackTable').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('feedbackTable').innerHTML =
                '<tr class="empty-row"><td colspan="4" style="color:#e74c3c;">加载失败</td></tr>';
        });
}

loadBooks();
loadFeedbacks();
</script>
</body>
</html>
