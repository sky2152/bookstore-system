<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>充值余额</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}
.header {
    background: rgba(255,255,255,0.1);
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 { font-size: 22px; font-weight: 600; }
.header a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    font-size: 14px;
}
.container {
    max-width: 600px;
    margin: 80px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 45px 40px;
}
.card h2 {
    font-size: 24px;
    margin-bottom: 25px;
    color: #333;
    font-weight: 600;
    text-align: center;
}
.current-balance {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 30px;
}
.current-balance p { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
.current-balance strong { font-size: 36px; font-weight: 700; }
.form-group { margin-bottom: 20px; }
.form-group label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    color: #666;
    font-weight: 500;
}
.form-group input {
    width: 100%;
    padding: 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    box-sizing: border-box;
}
.form-group input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.quick-amounts {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}
.quick-btn {
    flex: 1;
    min-width: 80px;
    padding: 14px;
    background: #f8f9fa;
    color: #667eea;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.quick-btn:hover {
    background: #667eea;
    color: white;
    border-color: #667eea;
}
.btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102,126,234,0.4);
}
.btn-back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}
.btn-back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="header">
    <h1>💰 余额充值</h1>
    <a href="/user/index">返回商城</a>
</div>

<div class="container">
    <div class="card">
        <h2>充值到账户</h2>
        <div class="current-balance">
            <p>当前余额</p>
            <strong id="currentBalance">¥0.00</strong>
        </div>
        <form action="/user/recharge" method="post">
            <div class="form-group">
                <label>快捷充值</label>
                <div class="quick-amounts">
                    <button type="button" class="quick-btn" onclick="setAmount(50)">¥50</button>
                    <button type="button" class="quick-btn" onclick="setAmount(100)">¥100</button>
                    <button type="button" class="quick-btn" onclick="setAmount(200)">¥200</button>
                    <button type="button" class="quick-btn" onclick="setAmount(500)">¥500</button>
                </div>
            </div>
            <div class="form-group">
                <label>或输入充值金额（元）</label>
                <input type="number" id="amountInput" name="money" min="1" step="1" placeholder="请输入充值金额" required>
            </div>
            <button type="submit" class="btn-primary">确认充值</button>
            <a href="/user/index" class="btn-back">返回商城</a>
        </form>
    </div>
</div>

<script>
function setAmount(amount) {
    document.getElementById('amountInput').value = amount;
}
// 加载当前余额
fetch('/api/user/balance')
    .then(r => r.json())
    .then(data => {
        if(data && data.balance !== undefined) {
            document.getElementById('currentBalance').textContent = '¥' + data.balance;
        }
    })
    .catch(err => {
        document.getElementById('currentBalance').textContent = '加载中...';
    });
</script>
</body>
</html>
