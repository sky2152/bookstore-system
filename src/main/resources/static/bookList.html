<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理员图书管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    color: #333;
}
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    font-size: 22px;
    font-weight: 600;
}
.header .nav-links a {
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    margin-left: 10px;
    transition: all 0.3s;
    font-size: 14px;
}
.header .nav-links a:hover {
    background: rgba(255,255,255,0.35);
}
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
.form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}
.form-row input,
.form-row select {
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    flex: 1;
    min-width: 100px;
}
.form-row input:focus,
.form-row select:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.btn-primary {
    padding: 12px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
th {
    background: #f8f9fa;
    padding: 16px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    color: #555;
    border-bottom: 2px solid #e5e7eb;
}
td {
    padding: 16px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}
tr:hover {
    background: #fafbfc;
}
.price {
    color: #e67e22;
    font-weight: 600;
}
.category-tag {
    display: inline-block;
    padding: 4px 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.btn-edit {
    color: #3498db;
    text-decoration: none;
    margin-right: 12px;
    font-weight: 500;
    cursor: pointer;
}
.btn-edit:hover { color: #2980b9; }
.btn-delete {
    color: #e74c3c;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
}
.btn-delete:hover { color: #c0392b; }
.empty-row td {
    text-align: center;
    padding: 60px 12px;
    color: #999;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}
.modal.active { display: flex; }
.modal-content {
    background: white;
    border-radius: 16px;
    padding: 30px;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.modal-content h3 {
    margin-bottom: 20px;
    font-size: 18px;
    color: #333;
}
.modal-content label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #666;
    font-weight: 500;
}
.modal-content input,
.modal-content select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
}
.modal-content input:focus,
.modal-content select:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.btn-save {
    padding: 12px 28px;
    background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(46,204,113,0.4);
}
.btn-cancel {
    padding: 12px 28px;
    background: #95a5a6;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 10px;
    transition: all 0.3s;
}
.btn-cancel:hover { background: #7f8c8d; }

/* 进货建议 */
.restock-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}
.restock-urgent {
    background: #f8d7da;
    color: #721c24;
}
.restock-warn {
    background: #fff3cd;
    color: #856404;
}
.restock-ok {
    background: #d4edda;
    color: #155724;
}
.sales-num {
    font-weight: 600;
    color: #e74c3c;
}
.sales-zero { color: #ccc; font-weight: 400; }

/* 消息提示 */
.msg-box {
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}
.msg-box.show { display: block; animation: fadeIn 0.3s; }
.msg-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.msg-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 搜索栏 */
.search-row {
    display: flex;
    gap: 12px;
    align-items: center;
}
.search-row input {
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    flex: 1;
}
.search-row input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}

/* 销量图表 */
.chart-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    margin-bottom: 25px;
}
.chart-card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    font-weight: 600;
    display: flex;
    align-items: center;
}
.chart-card h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
    margin-right: 12px;
}
.chart-wrapper {
    position: relative;
    height: 320px;
}

/* 批量导入弹窗 */
.batch-textarea {
    width: 100%;
    min-height: 200px;
    padding: 14px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 13px;
    font-family: monospace;
    outline: none;
    transition: all 0.3s;
    background: #f8f9fa;
    resize: vertical;
    line-height: 1.8;
}
.batch-textarea:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.batch-format {
    background: #f8f9fa;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 12px;
    color: #666;
    line-height: 1.8;
}
.batch-format code {
    background: #e8eaf6;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
    color: #5c6bc0;
    font-size: 12px;
}
.batch-format .ex-line {
    font-family: monospace;
    color: #333;
    background: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 4px;
}
.btn-batch {
    padding: 12px 20px;
    background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
}
.btn-batch:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(230,126,34,0.4);
}
</style>
</head>
<body>
<div class="header">
    <h1>📚 书店管理系统</h1>
    <div class="nav-links">
        <a href="categoryList.html">分类管理</a>
        <a href="/feedback/admin/page">缺货反馈管理</a>
        <a href="/comment/admin/page">评论管理</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div id="msgBox" class="msg-box"></div>

    <div class="card">
        <h2>新增图书</h2>
        <form action="/book/add" method="post" class="form-row">
            <input name="bookName" placeholder="书名" required>
            <input name="author" placeholder="作者" required>
            <input name="price" type="number" step="0.01" min="0" placeholder="价格" required>
            <input name="stock" type="number" min="0" placeholder="库存" required>
            <select name="categoryId" id="categorySelect" required>
                <option value="">请选择分类</option>
            </select>
            <button type="submit" class="btn-primary">+ 新增</button>
            <button type="button" class="btn-batch" onclick="openBatch()">批量导入</button>
        </form>
    </div>

    <div class="chart-card">
        <h2>📊 图书销量统计</h2>
        <div class="chart-wrapper">
            <canvas id="salesChart"></canvas>
            <div id="chartFallback" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;">加载中...</div>
        </div>
    </div>

    <div class="card">
        <h2>图书列表</h2>
        <div class="search-row" style="margin-bottom:16px;">
            <input type="text" id="keyword" placeholder="输入书名或作者关键字搜索" onkeydown="if(event.key==='Enter')searchBooks()">
            <select id="categoryFilter" onchange="searchBooks()" style="padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;background:#f8f9fa;cursor:pointer;">
                <option value="">全部分类</option>
            </select>
            <button class="btn-primary" onclick="searchBooks()">搜索</button>
            <button class="btn-primary" style="background:#95a5a6;" onclick="resetSearch()">重置</button>
        </div>
        <table>
            <tr>
                <th>ID</th><th>书名</th><th>作者</th><th>价格</th><th>库存</th><th>销量</th><th>分类</th><th>进货建议</th><th>操作</th>
            </tr>
            <tr class="empty-row"><td colspan="9">加载中...</td></tr>
        </table>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3>编辑图书</h3>
        <form id="editForm" action="/book/edit" method="post">
            <input type="hidden" name="id" id="editId">
            <label>书名</label>
            <input name="bookName" id="editBookName" required>
            <label>作者</label>
            <input name="author" id="editAuthor" required>
            <label>价格</label>
            <input name="price" id="editPrice" type="number" step="0.01" min="0" required>
            <label>库存</label>
            <input name="stock" id="editStock" type="number" min="0" required>
            <label>分类</label>
            <select name="categoryId" id="editCategory" required></select>
            <button type="submit" class="btn-save">保存修改</button>
            <button type="button" class="btn-cancel" onclick="closeEdit()">取消</button>
        </form>
    </div>
</div>

<!-- 批量导入弹窗 -->
<div class="modal" id="batchModal">
    <div class="modal-content" style="max-width:600px;">
        <h3>📥 批量导入图书</h3>
        <div class="batch-format">
            每行一本书，字段用逗号分隔，格式：<br>
            <code>书名, 作者, 价格, 库存, 分类名称</code><br>
            <span class="ex-line">Java编程思想, Bruce Eckel, 108.00, 50, 计算机</span><br>
            <span class="ex-line">三体, 刘慈欣, 68.00, 100, 文学小说</span>
        </div>
        <textarea class="batch-textarea" id="batchText" placeholder="Java编程思想, Bruce Eckel, 108.00, 50, 计算机&#10;三体, 刘慈欣, 68.00, 100, 文学小说&#10;活着, 余华, 39.00, 80, 文学小说"></textarea>
        <div style="margin-top:16px;display:flex;gap:10px;">
            <button class="btn-save" onclick="submitBatch()">确认导入</button>
            <button class="btn-cancel" onclick="closeBatch()">取消</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
let categoryOptions = [];
let currentKeyword = '';

// 读取URL参数显示提示
(function(){
    let params = new URLSearchParams(window.location.search);
    let error = params.get('error');
    let msg = params.get('msg');
    if(error) showMsg(decodeURIComponent(error), 'error');
    if(msg) showMsg(decodeURIComponent(msg), 'success');
    if(history.replaceState){
        history.replaceState(null, '', '/bookList.html');
    }
})();

function showMsg(text, type){
    let box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box show ' + type;
    setTimeout(() => { box.className = 'msg-box'; }, 4000);
}

// 搜索图书（关键字+分类）
function searchBooks(){
    currentKeyword = document.getElementById('keyword').value.trim();
    loadBooks();
}

// 重置搜索
function resetSearch(){
    document.getElementById('keyword').value = '';
    document.getElementById('categoryFilter').value = '';
    currentKeyword = '';
    loadBooks();
}

// 加载图书列表（带搜索+分类过滤）
function loadBooks(){
    fetch('/api/book/stats')
        .then(r => r.json())
        .then(data => {
            // 前端按分类过滤
            let catId = document.getElementById('categoryFilter').value;
            let filtered = catId ? data.filter(b => b.categoryId == catId) : data;

            // 前端按关键字过滤
            if(currentKeyword){
                let kw = currentKeyword.toLowerCase();
                filtered = filtered.filter(b =>
                    (b.bookName && b.bookName.toLowerCase().includes(kw)) ||
                    (b.author && b.author.toLowerCase().includes(kw))
                );
            }

            let html = '<tr><th>ID</th><th>书名</th><th>作者</th><th>价格</th><th>库存</th><th>销量</th><th>分类</th><th>进货建议</th><th>操作</th></tr>';
            if(filtered.length === 0) {
                html += '<tr class="empty-row"><td colspan="9">' + (currentKeyword || catId ? '未找到匹配的图书' : '暂无图书，请先添加') + '</td></tr>';
            } else {
                filtered.forEach(book => {
                    let sales = book.sales || 0;
                    let stock = book.stock;
                    let restockHtml = '';
                    if(sales > 0 && stock < sales){
                        restockHtml = '<span class="restock-tag restock-urgent">急需进货</span>';
                    } else if(stock < 10){
                        restockHtml = '<span class="restock-tag restock-warn">建议补货</span>';
                    } else {
                        restockHtml = '<span class="restock-tag restock-ok">库存充足</span>';
                    }
                    let salesHtml = sales > 0
                        ? '<span class="sales-num">' + sales + ' 本</span>'
                        : '<span class="sales-zero">暂无</span>';

                    html += '<tr>' +
                        '<td>' + book.id + '</td>' +
                        '<td><strong>' + book.bookName + '</strong></td>' +
                        '<td>' + book.author + '</td>' +
                        '<td class="price">¥' + book.price + '</td>' +
                        '<td>' + book.stock + '</td>' +
                        '<td>' + salesHtml + '</td>' +
                        '<td><span class="category-tag">' + (book.categoryName || '未分类') + '</span></td>' +
                        '<td>' + restockHtml + '</td>' +
                        '<td>' +
                            '<a href="#" class="btn-edit" onclick="editBook(' + book.id + ',\'' +
                                book.bookName.replace(/'/g,"\\'") + '\',\'' +
                                book.author.replace(/'/g,"\\'") + '\',' +
                                book.price + ',' +
                                book.stock + ',' +
                                book.categoryId + ');return false;">编辑</a>' +
                            '<a href="/book/delete?id=' + book.id + '" class="btn-delete" onclick="return confirm(\'确认删除?\')">删除</a>' +
                        '</td>' +
                        '</tr>';
                });
            }
            document.querySelector('table').innerHTML = html;
        })
        .catch(err => {
            document.querySelector('table').innerHTML =
                '<tr class="empty-row"><td colspan="9" style="color:#e74c3c;">加载失败</td></tr>';
        });
}

// 初始加载
loadBooks();

// ===== 销量图表 =====
let salesChartInstance = null;
function loadSalesChart(){
    fetch('/api/book/stats')
        .then(r => r.json())
        .then(data => {
            let fallback = document.getElementById('chartFallback');
            if(!data || data.length === 0){
                if(fallback) fallback.textContent = '暂无销量数据';
                return;
            }
            // 取销量前10的图书
            let top = data.slice(0, 10);
            let labels = top.map(b => b.bookName.length > 8 ? b.bookName.substring(0,8)+'...' : b.bookName);
            let salesData = top.map(b => b.sales || 0);
            let stockData = top.map(b => b.stock || 0);

            if(fallback) fallback.style.display = 'none';
            let canvas = document.getElementById('salesChart');

            if(salesChartInstance){ salesChartInstance.destroy(); }

            if(typeof Chart === 'undefined'){
                // Chart.js 未加载，用 CSS bar 降级
                let html = '';
                let maxSale = Math.max(...salesData, 1);
                top.forEach((b, i) => {
                    let pct = (b.sales || 0) / maxSale * 100;
                    let color = i === 0 ? '#f39c12' : i === 1 ? '#95a5a6' : i === 2 ? '#e67e22' : '#667eea';
                    html += '<div style="display:flex;align-items:center;margin-bottom:10px;">' +
                        '<div style="width:120px;font-size:12px;color:#555;text-align:right;padding-right:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + b.bookName + '</div>' +
                        '<div style="flex:1;background:#f0f0f0;border-radius:6px;height:24px;overflow:hidden;">' +
                            '<div style="width:' + pct + '%;height:100%;background:' + color + ';border-radius:6px;transition:width 0.6s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:white;font-size:11px;font-weight:600;">' +
                                (b.sales || 0) +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
                canvas.outerHTML = '<div style="padding:10px 0;">' + html + '</div>';
                return;
            }

            salesChartInstance = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '销量',
                            data: salesData,
                            backgroundColor: 'rgba(102,126,234,0.8)',
                            borderRadius: 6
                        },
                        {
                            label: '当前库存',
                            data: stockData,
                            backgroundColor: 'rgba(236,239,241,0.9)',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 12 } } },
                        tooltip: {
                            callbacks: {
                                title: function(items){
                                    return data[items[0].dataIndex].bookName;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 11 } } },
                        x: { ticks: { font: { size: 11 } } }
                    }
                }
            });
        })
        .catch(err => {
            let fallback = document.getElementById('chartFallback');
            if(fallback) fallback.textContent = '图表加载失败';
        });
}
loadSalesChart();

// ===== 批量导入弹窗 =====
function openBatch(){
    document.getElementById('batchModal').style.display = 'flex';
}
function closeBatch(){
    document.getElementById('batchModal').style.display = 'none';
}
function submitBatch(){
    let text = document.getElementById('batchText').value.trim();
    if(!text){
        alert('请输入图书数据');
        return;
    }
    let btn = event.target;
    btn.disabled = true;
    btn.textContent = '导入中...';
    fetch('/book/batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'batchText=' + encodeURIComponent(text)
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        btn.textContent = '确认导入';
        if(data.success){
            closeBatch();
            document.getElementById('batchText').value = '';
            showMsg(data.message, 'success');
            loadBooks();
            loadSalesChart();
        } else {
            showMsg(data.message || '导入失败', 'error');
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.textContent = '确认导入';
        showMsg('提交失败，请检查网络或重新登录', 'error');
    });
}

fetch('/api/category/list')
    .then(r => r.json())
    .then(data => {
        categoryOptions = data;
        fillCategorySelect('categorySelect');
        fillCategorySelect('editCategory');
        // 填充搜索筛选下拉
        let filterSel = document.getElementById('categoryFilter');
        if(filterSel){
            data.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.categoryName;
                filterSel.appendChild(opt);
            });
        }
    })
    .catch(err => console.error('加载分类失败', err));

function fillCategorySelect(selectId) {
    let sel = document.getElementById(selectId);
    if(!sel) return;
    if(selectId === 'categorySelect') {
        sel.innerHTML = '<option value="">请选择分类</option>';
    } else {
        sel.innerHTML = '';
    }
    categoryOptions.forEach(c => {
        let opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.categoryName;
        sel.appendChild(opt);
    });
}

function editBook(id, bookName, author, price, stock, categoryId) {
    document.getElementById('editId').value = id;
    document.getElementById('editBookName').value = bookName;
    document.getElementById('editAuthor').value = author;
    document.getElementById('editPrice').value = price;
    document.getElementById('editStock').value = stock;
    document.getElementById('editCategory').value = categoryId;
    document.getElementById('editModal').classList.add('active');
}

function closeEdit() {
    document.getElementById('editModal').classList.remove('active');
}
</script>
